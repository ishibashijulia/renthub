<div class="card h-100">
  <img class="card-img-top card-photo" [src]="property().photos[0]" [alt]="property().title" />

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ property().title }}</h5>
    <p class="text-muted mb-2">{{ property().location }} / ¥{{ property().price }}</p>
    <p class="card-text">{{ property().description }}</p>

    <div class="mt-auto d-flex gap-2">
      <a class="btn btn-primary btn-sm" [routerLink]="['/property', property().id]">View details</a>
      <button
        class="btn btn-sm"
        [class.btn-danger]="favoriteService.isFavorite(property().id)"
        [class.btn-outline-danger]="!favoriteService.isFavorite(property().id)"
        type="button"
        (click)="onFavorite()"
      >
        {{ favoriteService.isFavorite(property().id) ? 'Favorited ♥' : 'Mark as Favorite' }}
      </button>
    </div>
  </div>
</div>
