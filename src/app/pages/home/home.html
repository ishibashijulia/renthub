<app-featured-carousel [properties]="featured()" />

<section class="container my-4">
  <h2 class="mb-3">All Listings</h2>

  <!-- フィルタ -->
  <div class="card card-body mb-3">
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <label class="form-label" for="keyword">Keyword</label>
        <input
          id="keyword"
          class="form-control"
          placeholder="Title, building..."
          [value]="keyword()"
          (input)="keyword.set($any($event.target).value)"
        />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="loc">Location</label>
        <input
          id="loc"
          class="form-control"
          placeholder="Tokyo, Osaka..."
          [value]="location()"
          (input)="location.set($any($event.target).value)"
        />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="type">Property type</label>
        <select
          id="type"
          class="form-select"
          [value]="propertyType()"
          (change)="propertyType.set($any($event.target).value)"
        >
          <option value="">All</option>
          <option value="apartment">Apartment</option>
          <option value="house">House</option>
          <option value="villa">Villa</option>
          <option value="studio">Studio</option>
        </select>
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label" for="min">Min price (¥)</label>
        <input
          id="min"
          type="number"
          class="form-control"
          [value]="minPrice() ?? ''"
          (input)="minPrice.set(toNumberOrNull($any($event.target).value))"
        />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="max">Max price (¥)</label>
        <input
          id="max"
          type="number"
          class="form-control"
          [value]="maxPrice() ?? ''"
          (input)="maxPrice.set(toNumberOrNull($any($event.target).value))"
        />
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="furn">Furnished</label>
        <select
          id="furn"
          class="form-select"
          [value]="furnished()"
          (change)="furnished.set($any($event.target).value)"
        >
          <option value="any">Any</option>
          <option value="yes">Furnished</option>
          <option value="no">Unfurnished</option>
        </select>
      </div>
      <div class="col-12 col-md-3 d-flex align-items-end">
        <button class="btn btn-outline-secondary w-100" type="button" (click)="reset()">
          Reset
        </button>
      </div>

      <div class="col-12">
        <label class="form-label d-block">Amenities</label>
        @for (a of amenityList; track a) {
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'f-' + a"
              [checked]="selectedAmenities().includes(a)"
              (change)="toggleAmenity(a)"
            />
            <label class="form-check-label" [for]="'f-' + a">{{ a }}</label>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- 件数 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <span class="text-muted">{{ filtered().length }} listings found</span>
    <!-- sort -->
    <div class="d-flex align-items-center gap-2">
      <label class="form-label mb-0" for="sort">Sort by</label>
      <select
        id="sort"
        class="form-select w-auto"
        [value]="sortBy()"
        (change)="sortBy.set($any($event.target).value)"
      >
        <option value="newest">Newest</option>
        <option value="priceAsc">Price: low to high</option>
        <option value="priceDesc">Price: high to low</option>
      </select>
    </div>
  </div>
  <!-- 一覧 -->
  <div class="row g-4">
    @for (property of paged(); track property.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-property-card [property]="property" />
      </div>
    } @empty {
      <p class="text-muted">No listings match your search.</p>
    }
  </div>
  @if (totalPages() > 1) {
    <nav class="mt-4" aria-label="Listings pages">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="currentPage() === 1">
          <button class="page-link" type="button" (click)="goTo(currentPage() - 1)">
            Previous
          </button>
        </li>

        @for (n of pageNumbers(); track n) {
          <li class="page-item" [class.active]="n === currentPage()">
            <button class="page-link" type="button" (click)="goTo(n)">{{ n }}</button>
          </li>
        }

        <li class="page-item" [class.disabled]="currentPage() === totalPages()">
          <button class="page-link" type="button" (click)="goTo(currentPage() + 1)">Next</button>
        </li>
      </ul>
    </nav>
  }
</section>
