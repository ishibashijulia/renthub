<div class="container my-4">
  <h2>Profile</h2>
  <p class="text-muted">{{ auth.currentUser()?.name }} ({{ auth.currentUser()?.role }})</p>

  <h4 class="mt-4 mb-3">My favourites</h4>
  <div class="row g-4">
    @for (property of favoriteProperties(); track property.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-property-card [property]="property" />
      </div>
    } @empty {
      <p class="text-muted">No favourites yet.</p>
    }
  </div>
</div>
